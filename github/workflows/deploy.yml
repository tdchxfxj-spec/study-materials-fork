name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # 每次推送到 main 分支时自动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 仓库代码
        uses: actions/checkout@v4

      - name: 设置 GitHub Pages 环境
        uses: actions/configure-pages@v4

      - name: 上传静态文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # 纯静态 Markdown/HTML 文件直接用根目录

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
